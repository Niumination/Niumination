name: Regenerate README

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate config
        run: node scripts/validate.mjs

      - name: Regenerate README
        run: node scripts/generate-readme.mjs

      - name: Commit & Push
        run: |
          git config --global user.name 'Niumination Bot'
          git config --global user.email 'niumination@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate README from profile.config.json [automated]"
            git push
          fi
