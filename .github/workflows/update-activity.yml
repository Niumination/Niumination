name: Update Recent Activity

on:
  schedule:
    - cron: '0 8 * * *'  # Every day at 08:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update Recent Activity
        run: node scripts/update-activity.mjs
      
      - name: Commit & Push
        run: |
          git config --global user.name 'Niumination Bot'
          git config --global user.email 'niumination@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update recent activity [automated]"
            git push
          fi
