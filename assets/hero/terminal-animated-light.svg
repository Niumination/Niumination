<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <defs>
    <style>
      @keyframes glow {
        0%,100%{filter:drop-shadow(0 0 4px rgba(56,189,248,.2))}
        50%{filter:drop-shadow(0 0 10px rgba(56,189,248,.4))}
      }
      @keyframes typeCursor { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes fadeSlideUp {
        0%{opacity:0;transform:translateY(6px)}
        100%{opacity:1;transform:translateY(0)}
      }
      @keyframes scanline {
        0%{transform:translateY(-100%)}
        100%{transform:translateY(380px)}
      }
      .glow { animation:glow 3s ease-in-out infinite }
      .cursor { animation:typeCursor 1s step-end infinite }
      .scanline { animation:scanline 4s linear infinite }
      .l1 { animation:fadeSlideUp .35s .1s both }
      .l2 { animation:fadeSlideUp .35s .5s both }
      .l3 { animation:fadeSlideUp .35s .9s both }
      .l4 { animation:fadeSlideUp .35s 1.3s both }
      .l5 { animation:fadeSlideUp .35s 1.7s both }
      .l6 { animation:fadeSlideUp .35s 2.1s both }
      .l7 { animation:fadeSlideUp .35s 2.5s both }
      .l8 { animation:fadeSlideUp .35s 2.9s both }
      .l9 { animation:fadeSlideUp .35s 3.3s both }
      .l10 { animation:fadeSlideUp .35s 3.7s both }
    </style>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="12" fill="#f8fafc"/>

  <!-- Scanline -->
  <rect class="scanline" width="800" height="4" fill="rgba(56,189,248,.02)"/>

  <!-- Frame -->
  <rect x="1" y="1" width="798" height="378" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="glow"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="36" rx="12" fill="url(#barGrad)" opacity=".9"/>
  <rect x="1" y="26" width="798" height="11" fill="url(#barGrad)" opacity=".9"/>

  <!-- Window dots -->
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="38" cy="19" r="5" fill="#eab308"/>
  <circle cx="56" cy="19" r="5" fill="#22c55e"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b" letter-spacing="2">
    niumination — terminal v1.0.0
  </text>

  <!-- Terminal Content -->
  <g font-family="monospace" font-size="13" fill="#1e293b">

    <!-- LINE 1 -->
    <text x="24" y="65" class="l1" fill="#38bdf8">$</text>
    <text x="40" y="65" class="l1" fill="#64748b">systemctl boot --env=production</text>
    <text x="340" y="65" class="l1" fill="#16a34a">✓ OK</text>

    <!-- LINE 2 -->
    <text x="24" y="88" class="l2" fill="#38bdf8">$</text>
    <text x="40" y="88" class="l2" fill="#64748b">whoami</text>
    <text x="115" y="88" class="l2" fill="#0891b2">Afrizal Munthe — Pranata Komputer, Diskominfo Aceh Tengah</text>

    <!-- LINE 3 -->
    <text x="24" y="111" class="l3" fill="#38bdf8">$</text>
    <text x="40" y="111" class="l3" fill="#64748b">uname -d</text>
    <text x="130" y="111" class="l3" fill="#0891b2">SPBE · GovTech · AI Agents · Fullstack · Open Source</text>

    <!-- LINE 4 -->
    <text x="24" y="134" class="l4" fill="#38bdf8">$</text>
    <text x="40" y="134" class="l4" fill="#64748b">ls /ecosystem | wc -l</text>
    <text x="210" y="134" class="l4" fill="#d97706">40+ repositori aktif</text>

    <!-- LINE 5 -->
    <text x="24" y="162" class="l5" fill="#38bdf8">$</text>
    <text x="40" y="162" class="l5" fill="#64748b">cat featured.txt</text>
    <text x="195" y="162" class="l5" fill="#475569">PemdiAcehTengah · niu-dash · Niu-LKH · Flame-ADE · didong-code</text>

    <!-- LINE 6 -->
    <text x="24" y="190" class="l6" fill="#38bdf8">$</text>
    <text x="40" y="190" class="l6" fill="#64748b">cat tech-stack.txt</text>
    <text x="195" y="190" class="l6" fill="#475569">TypeScript  JavaScript  Python  Rust  Next.js  React  Tauri 2  Prisma</text>

    <!-- LINE 7 -->
    <text x="24" y="218" class="l7" fill="#38bdf8">$</text>
    <text x="40" y="218" class="l7" fill="#64748b">./agent --status</text>
    <text x="195" y="218" class="l7" fill="#0891b2">Hermes · Ollama · JCode bridge · Multi-agent orchestrator</text>

    <!-- LINE 8 -->
    <text x="24" y="246" class="l8" fill="#38bdf8">$</text>
    <text x="40" y="246" class="l8" fill="#64748b">df -h /spbe</text>
    <text x="175" y="246" class="l8" fill="#16a34a">SPBE Portal · KMS · LKH · AuditTI 🟢 Active</text>

    <!-- LINE 9 -->
    <text x="24" y="274" class="l9" fill="#38bdf8">$</text>
    <text x="40" y="274" class="l9" fill="#64748b">./status.sh --current</text>
    <text x="200" y="274" class="l9" fill="#16a34a">🟢 Building SPBE &amp; AI Agent Ecosystem</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="310" x2="780" y2="310" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Status bar -->
  <rect x="2" y="356" width="796" height="20" rx="4" fill="#e2e8f0" opacity=".8"/>
  <text x="16" y="370" font-family="monospace" font-size="11" fill="#64748b">NIUMINATION v1.0.0</text>
  <text x="280" y="370" font-family="monospace" font-size="11">
    <tspan fill="#64748b">MODE:</tspan>
    <tspan fill="#38bdf8"> INTERACTIVE</tspan>
  </text>
  <text x="460" y="370" font-family="monospace" font-size="11">
    <tspan fill="#64748b">NET:</tspan>
    <tspan fill="#16a34a"> ● ONLINE</tspan>
  </text>
  <text x="600" y="370" font-family="monospace" font-size="11">
    <tspan fill="#64748b">AGENT:</tspan>
    <tspan fill="#0891b2"> HERMES</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="40" y="278" width="8" height="13" fill="#38bdf8" class="cursor" opacity=".8" rx="1"/>
</svg>
